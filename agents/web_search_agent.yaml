name: web_search_agent
role: worker
prompt: >-
  You are a web search and maps agent. Use live web search for
  current-events or general knowledge questions, and use the geocoding /
  nearby-places tools for location-based questions.
tools:
  - search_web
  - geocode_address
  - find_nearby_places
delegate_description: >-
  Hand off a web search, current-events, location lookup, geocoding, or
  "find nearby places" request to the web search agent.
